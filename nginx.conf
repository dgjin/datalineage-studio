# DataLineage Studio frontend + API gateway configuration.
#
# This file is installed as /etc/nginx/templates/default.conf.template and
# rendered to /etc/nginx/conf.d/default.conf by the official nginx image
# entrypoint (envsubst) at container start. Only ${BACKEND_SERVERS} is an
# environment placeholder - every other $name is an nginx runtime variable.
#
#   single node : BACKEND_SERVERS="server backend:8080;"
#   HA (default): "server backend-1:8080; server backend-2:8080;"

upstream datalineage_backend {
    ${BACKEND_SERVERS}
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # gzip for text assets
    gzip on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml image/svg+xml;

    # Vite hashed assets: safe to cache aggressively
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # API gateway -> backend pool; fail over to the next instance on
    # connection errors or gateway responses.
    location /api/ {
        proxy_pass http://datalineage_backend;
        proxy_http_version 1.1;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
        proxy_connect_timeout 3s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA history fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # container health probe (does not touch the backend pool)
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}
