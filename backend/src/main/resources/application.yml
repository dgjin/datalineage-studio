# DataLineage Studio Backend Configuration
spring:
  application:
    name: datalineage-backend
  
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/datalineage?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
    username: root
    password: root123
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20
      max-wait: 60000
      time-between-eviction-runs-millis: 60000
      min-evictable-idle-time-millis: 300000
      validation-query: SELECT 1
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false
  
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true
    # Parallel workstreams may add migrations below the latest applied version
    # (e.g. V15 after V16); allow Flyway to apply them in a later run.
    out-of-order: true
  
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    serialization:
      write-dates-as-timestamps: false

# MyBatis Plus Configuration
mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.datalineage.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    banner: false
    db-config:
      id-type: assign_uuid
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# Server Configuration
server:
  port: 8080
  servlet:
    context-path: /api/v1

# Swagger / OpenAPI
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
  default-produces-media-type: application/json

# Jasypt Encryption
jasypt:
  encryptor:
    password: ${ENCRYPT_KEY:datalineage-default-key}
    algorithm: PBEWithMD5AndDES
    iv-generator-classname: org.jasypt.iv.NoIvGenerator

# JWT Authentication
app:
  jwt:
    secret: ${JWT_SECRET:DataLineageStudio-JwtSecret-2026-ChangeMeInProduction-0123456789abcdef}
    expiry-hours: 8

# Actuator / Micrometer (Prometheus monitoring)
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: never
  metrics:
    tags:
      application: datalineage-studio
    distribution:
      percentiles-histogram:
        http.server.requests: true

# Custom Application Configuration
datalineage:
  collector:
    thread-pool-size: 4
    default-timeout: 30000
    batch-size: 100
  security:
    password-encrypt-key: ${ENCRYPT_KEY:datalineage-default-key}
  frontend:
    allowed-origins: http://localhost:3000,http://127.0.0.1:3000

# Logging
logging:
  level:
    com.datalineage: debug
    com.datalineage.mapper: debug
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
